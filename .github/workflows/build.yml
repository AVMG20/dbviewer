name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  WAILS_VERSION: v3.1.0
  NODE_VERSION: "22"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            platform: darwin
          - name: Windows (x64)
            os: windows-latest
            platform: windows
          - name: Linux (x64)
            os: ubuntu-24.04
            platform: linux
    env:
      GIT_COMMITTER_NAME: DB Viewer
      GIT_COMMITTER_EMAIL: noreply@github.com
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.0.0-dev"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [[ "$V" != *dev* ]]; then
            perl -0pi -e "s|(<key>CFBundle(?:Short)?Version(?:String)?</key>\s*<string>)[^<]*|\${1}$V|g" build/darwin/Info.plist
            sed -i.bak -E "s/\"(file_version|product_version|FileVersion|ProductVersion)\": \"[^\"]*\"/\"\1\": \"$V\"/g" build/windows/info.json
            sed -i.bak -E "s/INFO_PRODUCTVERSION \"[^\"]*\"/INFO_PRODUCTVERSION \"$V\"/" build/windows/nsis/wails_tools.nsh
            sed -i.bak -E "s/^version: \"[^\"]*\"/version: \"$V\"/" build/linux/nfpm/nfpm.yaml
          fi

      - name: Test
        if: matrix.platform == 'linux'
        run: go test ./internal/sqltok/... ./internal/envimport/... ./internal/conn/...

      # ---------- macOS ----------
      - name: Package (macOS)
        if: matrix.platform == 'darwin'
        env:
          CGO_CFLAGS: -mmacosx-version-min=12.0
          CGO_LDFLAGS: -mmacosx-version-min=12.0
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          wails3 task darwin:package:universal
          codesign --force --deep --sign - "bin/DB Viewer.app"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "bin/DB Viewer.app" "dist/DB-Viewer-macos-universal.zip"

      # ---------- Windows ----------
      - name: Package (Windows)
        if: matrix.platform == 'windows'
        run: |
          wails3 task windows:package
          mkdir -p dist
          cp bin/dbviewer-amd64-installer.exe "dist/DB-Viewer-windows-x64-setup.exe"
          (cd bin && 7z a "../dist/DB-Viewer-windows-x64-portable.zip" dbviewer.exe)

      # ---------- Linux ----------
      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          wails3 task linux:create:deb
          mkdir -p dist
          cp bin/*.deb "dist/DB-Viewer-linux-amd64.deb"
          tar -C bin -czf "dist/DB-Viewer-linux-amd64.tar.gz" dbviewer

      - uses: actions/upload-artifact@v4
        with:
          name: dbviewer-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
